<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>咔哒书 · 图形候选</title>
<style>
:root{ --bg:#08090c; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.10);
  --text:#f2efe9; --muted:#8d8f99; --accent:#f0a63c; --accent-ink:#1a1206; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:13px/1.5 "Microsoft YaHei","PingFang SC",sans-serif;padding:26px 30px 40px}
h2{font-size:12px;letter-spacing:.2em;color:var(--muted);font-weight:600;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 12px 11px;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.big{width:96px;height:96px;display:block}
.sm{width:24px;height:24px;display:block}
.sm2{width:16px;height:16px;display:block}
.sizes{display:flex;align-items:center;gap:12px}
.cap{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.02em}
.cap b{display:block;color:var(--text);font-size:12px;font-weight:600;letter-spacing:.04em;margin-bottom:1px}
.mk{color:var(--accent)}
.sep{height:1px;background:var(--line);margin:30px 0 22px}
</style></head><body>
<h2>图形候选 · 96px / 24px / 16px（琥珀金 accent）</h2>
<div class="grid" id="grid"></div>

<script>
/* ============ 候选图形（48×48 viewBox，全部 currentColor） ============ */

// 摊开的书（正视，两页向中缝下倾）
const BOOK = `
  <path d="M23.3 33.4C19.2 30.2 14.2 28.6 9.6 28.6V16.6c4.6 0 9.6 1.6 13.7 4.8Z"/>
  <path d="M24.7 33.4c4.1-3.2 9.1-4.8 13.7-4.8V16.6c-4.6 0-9.6 1.6-13.7 4.8Z"/>`;

const MARKS = {
  'A1 环 + 书': `<g class="mk" fill="none" stroke="currentColor" stroke-width="2.8">
      <circle cx="24" cy="24" r="20.6"/></g>
    <g class="mk" fill="currentColor">${BOOK}</g>`,

  'A2 光圈断口环 + 书': `<g class="mk" fill="none" stroke="currentColor" stroke-width="2.9" stroke-linecap="round">
      <path d="M26.3 3.5A20.6 20.6 0 0 1 42.6 16.1"/>
      <path d="M44.4 27.4A20.6 20.6 0 0 1 31.4 43.6"/>
      <path d="M20.6 44.4A20.6 20.6 0 0 1 4.2 31.9"/>
      <path d="M3.5 21.7A20.6 20.6 0 0 1 16.6 4.4"/></g>
    <g class="mk" fill="currentColor">${BOOK}</g>`,

  'A3 书 + 镜头上圆': `<g class="mk" fill="currentColor">
      <circle cx="24" cy="10.6" r="6.2"/>
      <path d="M23.3 39.4C19.2 36.2 14.2 34.6 9.6 34.6V22.6c4.6 0 9.6 1.6 13.7 4.8Z"/>
      <path d="M24.7 39.4c4.1-3.2 9.1-4.8 13.7-4.8V22.6c-4.6 0-9.6 1.6-13.7 4.8Z"/></g>`,

  'A4 六叶光圈': `<g class="mk" fill="none" stroke="currentColor" stroke-width="2.9" stroke-linecap="round">
      <path d="M24 3.4A20.6 20.6 0 0 1 41.6 13.2"/>
      <path d="M44.6 24A20.6 20.6 0 0 1 34.8 41.6"/>
      <path d="M24 44.6A20.6 20.6 0 0 1 6.4 34.8"/>
      <path d="M3.4 24A20.6 20.6 0 0 1 13.2 6.4"/>
      <path d="M15.8 12.2 32.2 21.5"/><path d="M35.8 32.2 26.5 15.8"/>
      </g>
    <g class="mk" fill="currentColor">
      <path d="M21.7 27.4 24 25.6l2.3 1.8-2.3 1.8Z"/></g>`,

  'B1 折角页': `<g class="mk" fill="currentColor" fill-rule="evenodd">
      <path d="M15 4h18a7 7 0 0 1 7 7v18L25 44H15a7 7 0 0 1-7-7V11a7 7 0 0 1 7-7Z"/>
      <path d="M40 29 25 44V29Z" fill="#08090c" opacity="0"/></g>
    <path class="mk" d="M40 29 25 44V29Z" fill="currentColor" opacity=".45"/>`,

  'B2 折角页 + 镜头圆': `<path class="mk" fill="currentColor" fill-rule="evenodd"
      d="M15 4h18a7 7 0 0 1 7 7v18L25 44H15a7 7 0 0 1-7-7V11a7 7 0 0 1 7-7Z"/>
    <path class="mk" d="M40 29 25 44V29Z" fill="currentColor" opacity=".42"/>
    <circle class="mk" cx="22.5" cy="21.5" r="7.4" fill="none" stroke="currentColor" stroke-width="3"/>`,

  'B3 折角页(那角是照片)': `<path class="mk" fill="currentColor" fill-rule="evenodd"
      d="M15 4h18a7 7 0 0 1 7 7v18L25 44H15a7 7 0 0 1-7-7V11a7 7 0 0 1 7-7Z"/>
    <path class="mk" d="M40 29 25 44V29Z" fill="currentColor" opacity=".40"/>
    <g class="mk" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round">
      <rect x="12.5" y="13" width="14" height="11" rx="2.4"/>
      <path d="M12.5 21.2 17 17.6l3.4 2.9 2.6-2.2 3.5 3.2" stroke-width="2.1"/>
    </g>`,

  'C1 圆角方 + 咔': `<rect class="mk" x="4" y="4" width="40" height="40" rx="13" fill="currentColor"/>
    <text x="24" y="24" text-anchor="middle" dominant-baseline="central"
      font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="23" font-weight="700"
      fill="#1a1206">咔</text>`,

  'D1 书脊上的快门钮': `<g class="mk" fill="currentColor">
      <path d="M12 12.5a3.5 3.5 0 0 1 3.5-3.5h17a3.5 3.5 0 0 1 3.5 3.5v23a3.5 3.5 0 0 1-3.5 3.5h-17A3.5 3.5 0 0 1 12 35.5Z" opacity=".95"/>
      <path d="M27 9h9v30h-9Z" opacity=".55"/></g>
    <circle class="mk" cx="24" cy="24" r="7.2" fill="none" stroke="#08090c" stroke-width="2.6"/>
    <circle class="mk" cx="24" cy="24" r="2.6" fill="#08090c"/>`,

  'E1 两个半圆页': `<g class="mk" fill="currentColor">
      <path d="M22.6 40.5C16.2 36.4 12.2 29.8 12.2 22.5c0-7.3 4-13.9 10.4-18v36Z"/>
      <path d="M25.4 40.5c6.4-4.1 10.4-10.7 10.4-18 0-7.3-4-13.9-10.4-18v36Z" opacity=".62"/></g>`,
};

const grid = document.getElementById('grid');
for (const [name, inner] of Object.entries(MARKS)) {
  const c = document.createElement('div'); c.className = 'card';
  c.innerHTML = `<svg class="big" viewBox="0 0 48 48">${inner}</svg>
    <div class="sizes"><svg class="sm" viewBox="0 0 48 48">${inner}</svg>
      <svg class="sm2" viewBox="0 0 48 48">${inner}</svg></div>
    <div class="cap"><b>${name}</b></div>`;
  grid.appendChild(c);
}
</script>
</body></html>
