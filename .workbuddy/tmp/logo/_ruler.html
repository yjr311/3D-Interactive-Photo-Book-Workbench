<!DOCTYPE html><html><head><meta charset="utf-8"><title>ruler</title>
<style>body{margin:0;background:#0e1015}
 .w{display:flex;align-items:flex-end;gap:26px;padding:26px 30px}
 .c{display:flex;flex-direction:column;align-items:center;gap:9px}
 .c span{font:11px "Microsoft YaHei";color:#8b93a0}
 img.pix{image-rendering:pixelated}
</style></head><body><div class="w" id="w"></div>
<script>
const INK='#4a2708', FA='#eec9a4', FB='#d7a578';
const OPEN='M4.69 12.42C11.66 10.55 19.25 12.42 24 16.16C28.75 12.18 36.34 10.43 43.31 12.07C44.15 17.68 43.94 26.22 42.57 31.72C35.82 32.19 28.75 33.95 24 35.35C19.15 33.83 12.08 32.42 5.33 31.25C3.53 24.94 3.85 17.1 4.69 12.42Z';
const PL='M9.86 21.19C13.24 20.26 16.51 20.61 19.15 21.54';
const PR='M28.85 21.54C31.49 20.61 34.76 20.26 38.14 21.19';
const GUT='M24 17.21C23.58 22.71 23.58 28.91 24 34.76';
function mk(){return `<defs><linearGradient id="g" x1="0" y1="0" x2=".25" y2="1">
  <stop offset="0" stop-color="${FA}"/><stop offset="1" stop-color="${FB}"/></linearGradient>
 <clipPath id="c"><path d="${OPEN}" transform="translate(0 1.05)"/></clipPath></defs>
 <g transform="rotate(-13 24 24)"><g transform="translate(0 1.05)">
  <path d="${OPEN}" fill="url(#g)" stroke="${INK}" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
  <g clip-path="url(#c)"><path d="${OPEN}" fill="none" stroke="${INK}" stroke-width="1.1" opacity=".26" transform="translate(.55 -.6)"/></g>
  <g stroke="${INK}" stroke-width="1.9" stroke-linecap="round" fill="none" opacity=".5">
    <path d="${PL}"/><path d="${PR}"/></g>
  <path d="${GUT}" stroke="${INK}" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".95"/>
 </g></g>`;}
let h='';
for(const p of [140,96,64,48,32,29,24,16])
  h+=`<div class="c"><svg viewBox="0 0 48 48" width="${p}" height="${p}">${mk()}</svg><span>${p}${p===29?' 顶栏':p===16?' 标签页':''}</span></div>`;
h+=`<div class="c"><img class="pix" id="z" width="128" height="128"><span>16px 放大 8×</span></div>`;
document.getElementById('w').innerHTML=h;
const svgStr=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">${mk()}</svg>`;
const u='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svgStr)));
const c=document.createElement('canvas'); c.width=16;c.height=16;
const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=false;
const img=new Image();
img.onload=()=>{ctx.drawImage(img,0,0,16,16);
  const z=document.createElement('canvas'); z.width=16;z.height=16;
  z.getContext('2d').drawImage(c,0,0);
  document.getElementById('z').src=z.toDataURL();};
img.src=u;
</script></body></html>
