<!DOCTYPE html><html><head><meta charset="utf-8"><title>手绘方向 v3</title>
<style>
 body{margin:0;background:#0e1015;color:#e9e6e0;font:13px/1.6 "Microsoft YaHei",sans-serif}
 .wrap{padding:18px}
 .row{display:flex;gap:22px;align-items:flex-end;border-bottom:1px dashed #2a2f3a;padding:16px 6px}
 .row h3{width:170px;font-size:13px;margin:0;color:#f0a63c;flex:none}
 .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
 .cell span{font-size:11px;color:#7f8794}
 .light{background:#f4f2ed;color:#241f18;border-radius:10px}
 .light .cell span{color:#8a8377}
</style></head><body><div class="wrap" id="w"></div>
<script>
const INK='#4a2708', FILLA='#eec9a4', FILLB='#d7a578', SPARK='#ef9f2e';
const SW=3.4, IW=1.9;

/* 摊开小书：手抖轮廓（左右不对称、切口外鼓不均） */
const OPEN='M5.7 14.1C12.3 12.5 19.5 14.1 24 17.3C28.5 13.9 35.7 12.4 42.3 13.8C43.1 18.6 42.9 25.9 41.6 30.6C35.2 31 28.5 32.5 24 33.7C19.4 32.4 12.7 31.2 6.3 30.2C4.6 24.8 4.9 18.1 5.7 14.1Z';
const CLIP='clip-open', CLIPF='clip-close';
const PAGE_L='M10.6 21.6C13.8 20.8 16.9 21.1 19.4 21.9';
const PAGE_R='M28.6 21.9C31.1 21.1 34.2 20.8 37.4 21.6';
const GUT='M24 18.2C23.6 22.9 23.6 28.2 24 33.2';

/* 合上的相册：3/4 视角，封面贴着一张小照片 */
const ALBUM='M14.2 15.6C22 13.6 31.4 13.9 37.6 16C38.6 22.6 38.6 29.6 37.2 35.8C30.4 37.8 21.2 37.6 14.9 35.4C13.6 29 13.6 21.6 14.2 15.6Z';
const ALBUM_SPINE='M18.4 14.9C17.5 21.7 17.5 29 18.1 35.7';
const PHOTO='M22.6 19.9C26.2 19.2 30 19.2 33.4 20C33.9 23.8 33.9 27.6 33.4 31.3C29.9 32.1 26.1 32.1 22.6 31.3C22.1 27.5 22.1 23.7 22.6 19.9Z';
const PHOTO_IN='M24.4 22.2C26.2 21.9 28.6 21.9 30.4 22.2C30.6 24.4 30.6 27 30.4 29.2C28.5 29.5 26.2 29.5 24.4 29.2C24.2 27 24.2 24.4 24.4 22.2Z';

function grad(id){return `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="${FILLA}"/><stop offset="1" stop-color="${FILLB}"/></linearGradient>`;}
function defs(){return `<defs>${grad('gA')}${grad('gB')}
 <clipPath id="${CLIP}"><path d="${OPEN}"/></clipPath>
 <clipPath id="${CLIPF}"><path d="${ALBUM}"/></clipPath></defs>`;}

const OPEN_BOOK=`
  <path d="${OPEN}" fill="url(#gA)" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
  <g clip-path="url(#${CLIP})">
    <path d="${OPEN}" fill="none" stroke="${INK}" stroke-width="1.1" opacity=".28"
          transform="translate(.55 -.6)"/>
  </g>
  <g stroke="${INK}" stroke-width="${IW}" stroke-linecap="round" fill="none" opacity=".5">
    <path d="${PAGE_L}"/><path d="${PAGE_R}"/>
  </g>
  <path d="${GUT}" stroke="${INK}" stroke-width="${IW}" stroke-linecap="round" fill="none" opacity=".55"/>`;

const SPARKS=`<path d="M37.4 4.6C38.9 7.6 40.6 8.8 43.6 9.4C40.6 10 38.9 11.2 37.4 14.2C35.9 11.2 34.2 10 31.2 9.4C34.2 8.8 35.9 7.6 37.4 4.6Z"
   fill="${SPARK}" stroke="${INK}" stroke-width="2.8" stroke-linejoin="round"/>`;

const ALBUM_MARK=`
  <path d="${ALBUM}" fill="url(#gB)" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
  <g clip-path="url(#${CLIPF})">
    <path d="${ALBUM}" fill="none" stroke="${INK}" stroke-width="1.1" opacity=".28" transform="translate(.5 -.55)"/>
  </g>
  <path d="${ALBUM_SPINE}" stroke="${INK}" stroke-width="${IW}" stroke-linecap="round" fill="none" opacity=".45"/>
  <path d="${PHOTO}" fill="${FILLA}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="${PHOTO_IN}" fill="${FILLB}" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round" opacity=".9"/>`;

function wrap(inner,deg){return deg?`<g transform="rotate(${deg} 24 24)">${inner}</g>`:inner;}
const MK={
  A3:()=>wrap(OPEN_BOOK,0),
  A3t:()=>wrap(OPEN_BOOK,-13),
  E3:()=>wrap(OPEN_BOOK+SPARKS,-13),
  F3:()=>wrap(ALBUM_MARK,-6),
};
const NAMES={A3:'A 摊开小书·正放',A3t:'A′ 摊开小书·倾斜13°',E3:'E 摊开小书 + 咔哒火花',F3:'F 合上相册 + 封面小照片'};

function mk(k,px){return `<svg viewBox="0 0 48 48" width="${px}" height="${px}">${defs()}${MK[k]()}</svg>`;}
let h='';
for(const k of ['A3','A3t','E3','F3']){
  h+=`<div class="row"><h3>${NAMES[k]}</h3><div class="cell">${mk(k,168)}<span>168</span></div>`;
  for(const p of [96,64,48,32,24,16]) h+=`<div class="cell">${mk(k,p)}<span>${p}</span></div>`;
  h+='</div>';
}
h+='<div class="row light">';
for(const k of ['A3','A3t','E3','F3']) h+=`<div class="cell">${mk(k,72)}<span>${NAMES[k]}</span></div>`;
h+='</div>';
document.getElementById('w').innerHTML=h;
</script></body></html>
